<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1428A0"/>
      <stop offset="0.55" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#14B88A"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE48A"/>
      <stop offset="1" stop-color="#F2B705"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A1550" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="420" cy="80" r="150" fill="#ffffff" opacity="0.07"/>
  <circle cx="70" cy="470" r="120" fill="#ffffff" opacity="0.06"/>
  <!-- D monogram -->
  <path filter="url(#sh)" fill="#ffffff"
        d="M126 112 h118 c92 0 150 58 150 144 s-58 144 -150 144 h-118 z
           M196 176 v160 h44 c50 0 82 -32 82 -80 s-32 -80 -82 -80 z"
        fill-rule="evenodd"/>
  <!-- coin -->
  <g filter="url(#sh)">
    <circle cx="374" cy="372" r="74" fill="url(#coin)" stroke="#ffffff" stroke-width="10"/>
    <circle cx="374" cy="372" r="50" fill="none" stroke="#C98F00" stroke-width="5" opacity="0.6"/>
    <text x="374" y="394" text-anchor="middle" font-family="Inter Display, Inter, sans-serif"
          font-weight="800" font-size="60" fill="#8A5A00">DC</text>
  </g>
</svg>
